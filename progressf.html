<head> 
        <link rel="stylesheet" href="system.css" />
    </head>
    <style>
    .streak-card { 
        position: relative;
        border: 3px solid rgb(243, 90, 197);
    } 
        
        .streak-card {
            margin: 0;
            position: absolute;
            top: 30%;
            -ms-transform: translateY(-45%);
            transform: translateY(-20%);
            -ms-transform: translateX(+100%);
            transform: translateX(+220%);
        }

        .streak-buttons{
            margin: 0;
            position: absolute;
            top: 55%;
            -ms-transform: translateY(-45%);
            transform: translateY(-20%);
            -ms-transform: translateX(+100%);
            transform: translateX(+125%);
        }
              

    </style>
    <body>
        <img src = "https://i.pinimg.com/originals/81/0f/75/810f75fc99020e665a8a500556fbf2a1.gif" />
        <div class="streak-card">
            <div class="streak-icon"></div>
            <div class="streak-info">
                <span class="streak-number" id="streakCount">5</span>
                <span class="streak-label">Série de jours</span>
            </div>
        </div>

        <div class = "streak-buttons">
            <button id="incrementBtn">Enregistrement</button>
            <button id="resetBtn" class="btn-reset">Réinitialiser la série</button>
        </div>

        <script src="./streaksystem.js"></script>
    </body>
